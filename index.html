<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b4f8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Памятка ДПС">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="stylesheet" href="styles.css">
    <title>Памятка ДПС</title>
  </head>
  <body>
    <header class="app-header">
      <button id="back" type="button" aria-label="Назад">‹</button>
      <h1 id="title">Памятка ДПС</h1>
      <button id="home" type="button" aria-label="Главная">⌂</button>
    </header>
    <main>
      <label class="search"><span>Поиск по справочнику</span><input id="search" type="search" autocomplete="off" placeholder="Например: 12.8 КоАП"></label>
      <section id="search-results" hidden></section>
      <section id="screen" aria-live="polite"><p class="loading">Загрузка справочника…</p></section>
    </main>
    <noscript>Для работы справочника включите JavaScript.</noscript>
    <script src="app.js" defer></script>
